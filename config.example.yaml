# Reminder Bot Configuration
# Copy this file to config.yaml and fill in your values
# NEVER commit config.yaml to git (it contains secrets)

# Telegram Bot Configuration
telegram:
  bot_token: "YOUR_BOT_TOKEN_HERE"  # Get from @BotFather on Telegram

  # Authorized user IDs (only these users can interact with the bot)
  # To find your ID: message the bot and it will tell you your ID if you're not authorized
  authorized_users:
    - 123456789  # Replace with your Telegram user ID
    # - 987654321  # Uncomment and add partner's ID

# LLM Configuration
llm:
  # Provider options:
  # - "openai" (gpt-4o-mini, very cheap ~$0.15/1M tokens)
  # - "groq" (free tier: 14,400 req/day, no credit card)
  # - "gemini" (free tier severely limited as of Dec 2025)
  # - "ollama" (local, private - for Raspberry Pi)
  provider: "openai"

  # OpenAI settings (recommended if you have an API key)
  # Get API key from: https://platform.openai.com/api-keys
  openai:
    api_key: "YOUR_OPENAI_API_KEY_HERE"
    model: "gpt-4o-mini"  # Very cheap: ~$0.15/1M input tokens

  # Groq settings (best free option - no credit card needed)
  # Get API key from: https://console.groq.com
  groq:
    api_key: "YOUR_GROQ_API_KEY_HERE"
    model: "llama-3.3-70b-versatile"

  # Gemini settings (free tier: 250 req/day with 2.5-flash)
  gemini:
    api_key: "YOUR_GEMINI_API_KEY_HERE"  # Get from aistudio.google.com
    model: "gemini-2.5-flash"  # Better quality, 250 req/day free tier

  # Ollama settings (used when provider is "ollama")
  # For future migration to Raspberry Pi
  ollama:
    host: "http://localhost:11434"
    model: "llama3.2"

# Timezone (for interpreting "tomorrow", "next week", etc.)
timezone: "Asia/Singapore"

# Default schedule rules
# These define what happens when no specific time is given
schedule_defaults:
  # General reminders: default to next morning
  general:
    default_time: "09:00"

  # Bill reminders: default to Saturday morning
  bill:
    day: "saturday"
    time: "09:00"

  # Food expiry reminders: day before, morning and evening
  food_expiry:
    days_before: 1
    times:
      - "09:00"
      - "18:00"

# Database path (SQLite)
database:
  path: "reminders.db"

# Daily summary settings
daily_summary:
  enabled: true        # Set to false to disable automatic daily summary
  time: "08:00"        # Time to send daily summary (24h format)
